services:
  - type: web
    name: shl-assessment-recommender
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: CATALOG_PATH
        value: data/catalog.json
      - key: USE_LLM
        value: true
      - key: LLM_PROVIDER
        value: gemini
      - key: MODEL_NAME
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
